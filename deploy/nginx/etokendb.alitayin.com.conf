limit_req_zone $binary_remote_addr zone=etokendb_api_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=etokendb_conn_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name etokendb.alitayin.com;

    client_max_body_size 10m;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        limit_req zone=etokendb_api_per_ip burst=30 nodelay;
        limit_conn etokendb_conn_per_ip 20;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
